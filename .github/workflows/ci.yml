name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (lockfile present)
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Bootstrap dependencies (new template)
        if: hashFiles('package-lock.json') == ''
        run: npm install
      - run: npm run check
      - run: npm pack --dry-run
